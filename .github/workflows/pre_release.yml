on: workflow_dispatch
name: Test, Build and Pre Release apk
env:
  PROPERTIES_PATH: "./android/key.properties"
jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    # Extract version from pubspec.yaml so the asset name always matches the build
    - name: Extract version
      id: extract_version
      run: |
        version=$(grep -oP '(?<=version: )\d+\.\d+\.\d+' pubspec.yaml)
        echo "version=${version}" >> $GITHUB_OUTPUT
    # Setup Java environment in order to build the Android app.
    - uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17.x'
    # Gradle cache for faster builds
    - uses: actions/cache@v5
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    # Setup the flutter environment.
    - run: |
        pip install -U yq
        echo "FLUTTER_VERSION=$(yq -r .environment.flutter pubspec.yaml | sed 's/\^//g')" >> $GITHUB_ENV
    - uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        flutter-version: "${{ env.FLUTTER_VERSION }}"

    #
    - run: |
          echo keyPassword=\${{ secrets.KEY_STORE }} > ${{env.PROPERTIES_PATH}}
          echo storePassword=\${{ secrets.KEY_PASSWORD }} >> ${{env.PROPERTIES_PATH}}
          echo keyAlias=\${{ secrets.KEY_ALIAS }} >> ${{env.PROPERTIES_PATH}}
    #
    - run: echo "${{ secrets.KEYSTORE2 }}" | base64 --decode > android/app/key.jks

    # Get flutter dependencies.
    - run: flutter pub get
    # Statically analyze the Dart code for any errors.
    - run: flutter analyze .
     # Build arm64 APK for GitHub pre-release
    - name: Build arm64 APK
      run: flutter build apk --release --split-per-abi --target-platform="android-arm64" --flavor github
    # Pre-release arm64 generated APK
    - name: Release arm64 APK
      uses: svenstaro/upload-release-action@v2
      with:
        repo_name: thamodharangm/catchify
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: build/app/outputs/flutter-apk/app-arm64-v8a-github-release.apk
        asset_name: catchify-v${{ steps.extract_version.outputs.version }}-arm64-v8a.apk
        tag: ${{ github.ref }}
        prerelease: true
        overwrite: true
        body: "**New Catchify Pre-Release!**\n\nWith pre-release / [BETA] builds you have access to the latest build of the app before it is released as stable-release version. Only use pre-release if you test the app, provide feedback, and help us improve its performance. Please note that pre-release versions of the app may be pretty unstable. You may experience crashes, bugs, or other issues while using the app. This is because pre-release version is still in development."
    # Build universal APK for GitHub pre-release
    - name: Build universal APK
      run: flutter build apk --release --flavor github
    # Pre-release universal generated APK
    - name: Release universal APK
      uses: svenstaro/upload-release-action@v2
      with:
        repo_name: thamodharangm/catchify
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: build/app/outputs/flutter-apk/app-github-release.apk
        asset_name: catchify-v${{ steps.extract_version.outputs.version }}.apk
        tag: ${{ github.ref }}
        prerelease: true
        overwrite: true