on:
  push:
    branches:
      - main

name: Test, Build and Release apk

permissions:
  contents: write


env:
  PROPERTIES_PATH: './android/key.properties'

jobs:
  build:
    name: Build APK
    if: "contains(github.event.head_commit.message, 'Update:')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Extract version from pubspec.yaml so releases can never drift out of sync
      - name: Extract version
        id: extract_version
        run: |
          version=$(grep -oP '(?<=version: )\d+\.\d+\.\d+' pubspec.yaml)
          echo "version=${version}" >> $GITHUB_OUTPUT

      # Setup Java environment in order to build the Android app.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17.x'

      # Gradle cache for faster builds
      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Setup the Flutter environment.
      - run: |
          pip install -U yq
          echo "FLUTTER_VERSION=$(yq -r .environment.flutter pubspec.yaml | sed 's/\^//g')" >> $GITHUB_ENV
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: "${{ env.FLUTTER_VERSION }}"

      #
      - run: |
          echo "keyPassword=${{ secrets.KEY_STORE }}" > ${{env.PROPERTIES_PATH}}
          echo "storePassword=${{ secrets.KEY_PASSWORD }}" >> ${{env.PROPERTIES_PATH}}
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> ${{env.PROPERTIES_PATH}}
      #
      - run: echo "${{ secrets.KEYSTORE2 }}" | base64 --decode > android/app/key.jks

      # Get Flutter dependencies.
      - name: Get Flutter dependencies
        run: flutter pub get

      # # Check for any formatting issues in the code.
      # - name: Check code formatting
      #   run: dart format --set-exit-if-changed .

      # Statically analyze the Dart code for any errors.
      - name: Analyze Dart code
        run: flutter analyze .

      # Build arm64 APK for GitHub release
      - name: Build arm64 APK
        run: flutter build apk --release --split-per-abi --target-platform="android-arm64" --flavor github

      # Release arm64 generated APK
      - name: Release arm64 APK
        uses: svenstaro/upload-release-action@v2
        with:
          repo_name: thamodharangm/catchify
          repo_token: ${{ secrets.CATCHIFY_WEBSITE_TOKEN }}
          file: build/app/outputs/flutter-apk/app-arm64-v8a-github-release.apk
          asset_name: catchify-v${{ steps.extract_version.outputs.version }}-arm64-v8a.apk
          tag: ${{ steps.extract_version.outputs.version }}
          prerelease: false
          overwrite: true

      # Build universal APK
      - name: Build universal APK
        run: flutter build apk --release --flavor github

      # Release universal generated APK
      - name: Release universal APK
        uses: svenstaro/upload-release-action@v2
        with:
          repo_name: thamodharangm/catchify
          repo_token: ${{ secrets.CATCHIFY_WEBSITE_TOKEN }}
          file: build/app/outputs/flutter-apk/app-github-release.apk
          asset_name: catchify-v${{ steps.extract_version.outputs.version }}.apk
          tag: ${{ steps.extract_version.outputs.version }}
          prerelease: false
          overwrite: true

      # Auto-update check.json in the catchify-website repo so the app's
      # update check picks up the new version without any manual edits.
      - name: Update check.json in catchify-website
        env:
          VERSION: ${{ steps.extract_version.outputs.version }}
          WEBSITE_TOKEN: ${{ secrets.CATCHIFY_WEBSITE_TOKEN }}
        run: |
          BASE_URL="https://github.com/thamodharangm/catchify/releases/download/${VERSION}"

          # Build the new check.json content
          NEW_CONTENT=$(printf '{
            "version": "%s",
            "announcementurl": null,
            "url": "%s/catchify-v%s.apk",
            "arm64url": "%s/catchify-v%s-arm64-v8a.apk"
          }' "$VERSION" "$BASE_URL" "$VERSION" "$BASE_URL" "$VERSION")

          # Base64-encode the content for the GitHub API
          ENCODED=$(echo "$NEW_CONTENT" | base64 -w 0)

          # Get the current SHA of check.json (required for update)
          SHA=$(curl -s \
            -H "Authorization: Bearer $WEBSITE_TOKEN" \
            "https://api.github.com/repos/thamodharangm/catchify/contents/check.json" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['sha'])")

          # Push the updated file via GitHub Contents API
          curl -s -X PUT \
            -H "Authorization: Bearer $WEBSITE_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/thamodharangm/catchify/contents/check.json" \
            -d "{
              \"message\": \"chore: update check.json for v${VERSION}\",
              \"content\": \"${ENCODED}\",
              \"sha\": \"${SHA}\"
            }"

          echo "check.json updated to v${VERSION}"
