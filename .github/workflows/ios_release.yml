name: Build and Package iOS IPA

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from pubspec.yaml
        id: extract_version
        run: |
          version=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml | head -n 1)
          if [ -z "$version" ]; then version="1.0.0"; fi
          echo "version=${version}" >> $GITHUB_OUTPUT

      - name: Setup Flutter environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Precache iOS artifacts
        run: flutter precache --ios

      - name: Build iOS (Release, Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package Payload into unsigned .IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r Catchify.ipa Payload
          ls -lh Catchify.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Catchify-v${{ steps.extract_version.outputs.version }}-iOS
          path: build/ios/iphoneos/Catchify.ipa
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: build/ios/iphoneos/Catchify.ipa
          name: Catchify iOS v${{ steps.extract_version.outputs.version }}
          tag_name: v${{ steps.extract_version.outputs.version }}-ios
          draft: false
          prerelease: false
          body: |
            ### Catchify for iOS (Unsigned .IPA)
            
            **Installation Instructions:**
            - **Jailbroken iPhones:** Install using **Filza File Manager** (make sure **AppSync Unified** is installed from Cydia/Sileo).
            - **TrollStore:** Open in TrollStore for permanent installation (no 7-day re-sign limit).
            - **Sideloadly / AltStore:** Sideload using your Apple ID on Windows or Mac.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
