name: Build and Package iOS IPA

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from pubspec.yaml
        id: extract_version
        run: |
          version=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml | head -n 1)
          if [ -z "$version" ]; then version="1.0.0"; fi
          echo "version=${version}" >> $GITHUB_OUTPUT

      - name: Setup Flutter environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Precache iOS artifacts
        run: flutter precache --ios

      - name: Configure Unsigned Build Settings
        run: |
          for f in ios/Flutter/Release.xcconfig ios/Flutter/Debug.xcconfig; do
            echo "" >> "$f"
            echo "CODE_SIGN_STYLE = Manual" >> "$f"
            echo "CODE_SIGNING_ALLOWED = NO" >> "$f"
            echo "CODE_SIGNING_REQUIRED = NO" >> "$f"
            echo "CODE_SIGN_IDENTITY =" >> "$f"
            echo "CODE_SIGN_IDENTITY[sdk=iphoneos*] =" >> "$f"
            echo "EXPANDED_CODE_SIGN_IDENTITY =" >> "$f"
            echo "DEVELOPMENT_TEAM =" >> "$f"
            echo "PROVISIONING_PROFILE_SPECIFIER =" >> "$f"
          done

      - name: Build iOS (Release, Unsigned)
        run: |
          flutter build ios --release --no-codesign --obfuscate --split-debug-info=build/ios/symbols || {
            echo "flutter build ios completed with error or codesign check; building directly with xcodebuild..."
            xcodebuild -workspace ios/Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build/ios_derived \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGN_STYLE=Manual \
              DEVELOPMENT_TEAM="" \
              PROVISIONING_PROFILE_SPECIFIER="" \
              build
            mkdir -p build/ios/iphoneos
            rm -rf build/ios/iphoneos/Runner.app
            cp -r build/ios_derived/Build/Products/Release-iphoneos/Runner.app build/ios/iphoneos/
          }

      - name: Package Payload into unsigned .IPA
        run: |
          if [ ! -d "build/ios/iphoneos/Runner.app" ]; then
            echo "Error: build/ios/iphoneos/Runner.app was not found!"
            find build -name "Runner.app" || true
            exit 1
          fi
          cd build/ios/iphoneos
          rm -rf Payload Catchify.ipa
          mkdir -p Payload
          cp -R Runner.app Payload/
          # Remove any invalid signature traces to ensure clean re-signing in Sideloadly
          rm -rf Payload/Runner.app/_CodeSignature
          find Payload -name ".DS_Store" -delete
          # Set proper executable permissions
          chmod -R 755 Payload/Runner.app
          # Preserve symlinks (-y) so Sideloadly codesign tool recognizes dynamic frameworks
          zip -9 -y -r Catchify.ipa Payload
          ls -lh Catchify.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Catchify-v${{ steps.extract_version.outputs.version }}-iOS
          path: build/ios/iphoneos/Catchify.ipa
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: build/ios/iphoneos/Catchify.ipa
          name: Catchify iOS v${{ steps.extract_version.outputs.version }}
          tag_name: v${{ steps.extract_version.outputs.version }}-ios
          draft: false
          prerelease: false
          body: |
            ### Catchify for iOS (.IPA)
            
            **Sideloadly Installation Instructions:**
            1. Download and install **Sideloadly** on your PC/Mac from [sideloadly.io](https://sideloadly.io).
            2. Connect your iPhone via USB (ensure it is trusted in iTunes/Apple Devices).
            3. Drag and drop `Catchify.ipa` into Sideloadly.
            4. Enter your Apple ID email and click **Start**.
            5. On your iPhone: Go to **Settings > General > VPN & Device Management** and trust your developer certificate.
            6. On iOS 16+: Go to **Settings > Privacy & Security > Developer Mode** and turn it ON.
            
            *(Tip: Sideloadly supports automatic Wi-Fi refresh, so you never have to plug in your phone every 7 days!)*
            
            **Other Installers:**
            - **TrollStore:** Direct install for permanent sideloading without 7-day limit (iOS 14.0 - 16.6.1 / 17.0).
            - **AltStore:** Sideload with AltServer.
            - **Jailbreak (Filza):** Install with AppSync Unified.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
