on: workflow_dispatch
name: Test, Build and Release debug apk

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    # Extract version from pubspec.yaml so the asset name always matches the build
    - name: Extract version
      id: extract_version
      run: |
        version=$(grep -oP '(?<=version: )\d+\.\d+\.\d+' pubspec.yaml)
        echo "version=${version}" >> $GITHUB_OUTPUT

    # Setup Java environment in order to build the Android app.
    - uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17.x'


    # Gradle cache for faster builds
    - uses: actions/cache@v5
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    # Setup the flutter environment.
    - uses: subosito/flutter-action@v2
      with:
        channel: "stable"

    # Get flutter dependencies.
    - run: flutter pub get
    # # Check for any formatting issues in the code.
    # - run: dart format --set-exit-if-changed .
    # Statically analyze the Dart code for any errors.
    - run: flutter analyze .
    # Build universal apk.
    - run: flutter build apk --debug --flavor github
    - uses: svenstaro/upload-release-action@v2
      with:
        repo_name: thamodharangm/catchify
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: build/app/outputs/flutter-apk/app-github-debug.apk
        asset_name: catchify-v${{ steps.extract_version.outputs.version }}-debug.apk
        tag: ${{ github.ref }}
        prerelease: true
        overwrite: true
        body: "**New Catchify Debug App!** \n
        with Debug / BETA builds you have access to the latest build of the app. Only use this version if you test the app, provide feedback, and help us improve its performance. Please note that Debug/BETA versions of the app may be pretty unstable. You may experience crashes, bugs, or other issues while using the app..
        "
